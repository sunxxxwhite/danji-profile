<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단지</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white' rx='18'/><ellipse cx='29' cy='21' rx='13' ry='20' fill='%23e8253a'/><ellipse cx='71' cy='21' rx='13' ry='20' fill='%23e8253a'/><circle cx='50' cy='67' r='35' fill='%23e8253a'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffbfb;--panel:#fff;--p2:#fff3f4;
  --b1:#ffd0d5;--b2:#ff8898;
  --red:#e8253a;--red2:#ff5c72;--red3:#ffe8eb;
  --gold:#f5a520;--txt:#1a080c;--sub:#8a5060;--muted:#c09098;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  background-image:radial-gradient(circle,rgba(232,37,58,.10) 1px,transparent 1px),
                   radial-gradient(circle,rgba(232,37,58,.05) 1px,transparent 1px);
  background-size:16px 16px,8px 8px;background-position:0 0,8px 8px;
  color:var(--txt);
  font-family:'Gowun Dodum','Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:12.5px;min-height:100vh;
}
a{color:var(--red);text-decoration:none;}
a:hover{text-decoration:underline;}
button{cursor:pointer;border:none;font-family:inherit;}
input,textarea,select{background:var(--p2);border:1px solid var(--b1);color:var(--txt);padding:4px 8px;font-size:12px;font-family:inherit;outline:none;border-radius:6px;}
input:focus,textarea:focus,select:focus{border-color:var(--red);}
textarea{resize:vertical;}
.rab{display:inline-block;vertical-align:middle;fill:currentColor;flex-shrink:0;}

/* ── NAV ── */
#topnav{background:#fff;border-bottom:3px solid var(--red);box-shadow:0 2px 12px rgba(232,37,58,.12);padding:6px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;}
#topnav .logo{display:flex;align-items:center;gap:7px;color:var(--red);font-size:14px;font-weight:700;letter-spacing:.5px;white-space:nowrap;}
#topnav a{color:var(--muted);font-size:11px;white-space:nowrap;}
#topnav a:hover{color:var(--red);text-decoration:none;}
#topnav .sp{flex:1;}
.nav-cur{color:var(--sub);font-size:11px;}
.nav-edit-btn{background:var(--p2);color:var(--red);border:1.5px solid var(--b1);font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.3px;}
.nav-edit-btn:hover,.nav-edit-btn.on{background:var(--red);color:#fff;border-color:var(--red);}

/* ── LOGIN MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,8,12,.45);z-index:900;backdrop-filter:blur(2px);}
.modal-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:901;background:var(--panel);border:1.5px solid var(--b1);border-radius:14px;box-shadow:0 8px 40px rgba(232,37,58,.18);width:320px;overflow:hidden;}
.modal-ph{background:linear-gradient(90deg,var(--red),#c01828);color:#fff;padding:12px 16px;font-size:13px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.modal-close{background:none;color:#fff;font-size:16px;line-height:1;padding:0 2px;opacity:.7;}
.modal-close:hover{opacity:1;}
.modal-tabs{display:flex;border-bottom:1px solid var(--b1);}
.modal-tab{flex:1;padding:8px;font-size:11px;font-weight:700;background:none;color:var(--muted);border-bottom:2.5px solid transparent;transition:all .15s;}
.modal-tab.on{color:var(--red);border-bottom-color:var(--red);}
.modal-body{padding:18px 16px;}
.m-fg{margin-bottom:10px;}
.m-fg label{display:block;color:var(--sub);font-size:10px;margin-bottom:4px;}
.m-fg input{width:100%;padding:7px 10px;}
.m-btn{width:100%;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:9px;border-radius:8px;margin-top:4px;}
.m-btn:hover{background:#c01828;}
.m-err{color:var(--red2);font-size:10px;margin-top:8px;text-align:center;min-height:16px;}
.m-notice{background:var(--red3);border:1px solid var(--b2);border-left:3px solid var(--red);border-radius:6px;padding:7px 10px;font-size:10px;color:var(--sub);margin-bottom:10px;}

/* ── LAYOUT ── */
#app{padding:8px 12px;}
#naru{display:grid;grid-template-columns:158px 1fr 180px;gap:9px;max-width:970px;margin:0 auto;align-items:start;}
.panel{background:var(--panel);border:1px solid var(--b1);border-radius:10px;box-shadow:0 2px 12px rgba(232,37,58,.06);margin-bottom:8px;overflow:hidden;}
.ph{background:linear-gradient(90deg,var(--red) 0%,#c01828 100%);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.6px;padding:5px 10px;display:flex;justify-content:space-between;align-items:center;}

/* ── EDIT-MODE INLINE FIELDS ── */
.ev{font-size:11px;color:var(--txt);}
.ev.empty{color:var(--muted);font-style:italic;}
.ei{display:none;width:100%;background:var(--p2);border:1px solid var(--b1);border-radius:6px;color:var(--txt);padding:3px 8px;font-size:11px;font-family:inherit;}
.ei:focus{border-color:var(--red);}
.edit-on .ev{display:none;}
.edit-on .ei{display:block;}
textarea.ei{min-height:72px;}
.esave{display:none;background:#fff2;color:#fff;border:1px solid #fff5;font-size:9px;padding:2px 8px;border-radius:10px;font-family:inherit;font-weight:700;}
.edit-on .esave{display:block;}

/* ── LEFT SIDEBAR ── */
.l-wrap{padding:14px 10px 10px;text-align:center;}
.l-av{width:88px;height:88px;border-radius:50%;border:3px solid var(--red);background:var(--red3);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(232,37,58,.22);position:relative;overflow:hidden;}
.l-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.l-av-ov{position:absolute;inset:0;background:rgba(232,37,58,.6);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;border-radius:50%;cursor:pointer;gap:2px;}
.edit-on .l-av-ov{display:flex;}
.l-name{color:var(--red);font-size:13px;font-weight:700;margin-bottom:2px;}
.l-name.empty{color:var(--muted);font-style:italic;}
.l-id{color:var(--muted);font-size:10px;margin-top:1px;}
.l-bio{color:var(--sub);font-size:10px;margin-top:2px;}
.l-bio.empty{color:var(--muted);font-style:italic;}
.l-socials{display:flex;justify-content:center;gap:12px;margin-top:8px;align-items:center;}
.x-btn{color:var(--red2);font-size:14px;font-weight:700;display:flex;align-items:center;}
.x-btn:hover{color:var(--red);text-decoration:none;}
hr.l-div{border:none;border-top:1px solid var(--b1);margin:8px 0;}
.l-nav a{display:flex;align-items:center;gap:7px;padding:5px 12px;color:var(--txt);font-size:11px;border-left:3px solid transparent;transition:all .12s;}
.l-nav a:hover,.l-nav a.on{color:var(--red);border-left-color:var(--red);background:var(--red3);text-decoration:none;}
.l-nav a .rab{fill:var(--muted);}
.l-nav a:hover .rab,.l-nav a.on .rab{fill:var(--red);}

/* avatar edit inputs */
.av-edit-area{display:none;margin-top:6px;}
.edit-on .av-edit-area{display:block;}
.av-file-inp{display:none;}
.av-url-inp{width:100%;font-size:9px;padding:3px 7px;}

/* X url edit */
.x-url-inp{display:none;width:100%;font-size:9px;padding:3px 7px;margin-top:4px;}
.edit-on .x-url-inp{display:block;}

/* ── BANNER ── */
.banner{background:linear-gradient(135deg,#ffe0e4 0%,#fff5f6 50%,#ffe3e7 100%);border:1px solid var(--b2);border-radius:10px;box-shadow:0 3px 16px rgba(232,37,58,.16);padding:18px 16px;position:relative;min-height:108px;margin-bottom:8px;overflow:hidden;}
.banner::after{content:'';position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(-45deg,rgba(232,37,58,.05) 0,rgba(232,37,58,.05) 1.5px,transparent 1.5px,transparent 10px);pointer-events:none;}
.b-title{position:relative;z-index:1;color:var(--red);font-size:22px;font-weight:700;letter-spacing:2px;margin-bottom:3px;text-shadow:0 1px 8px rgba(232,37,58,.15);}
.b-title.empty{color:var(--muted);font-size:16px;font-style:italic;font-weight:400;letter-spacing:0;}
.b-sub{position:relative;z-index:1;color:var(--sub);font-size:10px;}
.b-title-inp{display:none;position:relative;z-index:1;background:rgba(255,255,255,.75);border:1.5px solid var(--b2);border-radius:8px;color:var(--red);font-size:20px;font-weight:700;letter-spacing:1px;padding:3px 10px;margin-bottom:3px;width:55%;}
.b-title-inp:focus{border-color:var(--red);}
.edit-on .b-title{display:none;}
.edit-on .b-title-inp{display:block;}
.b-sub-inp{display:none;position:relative;z-index:1;background:rgba(255,255,255,.6);border:1px solid var(--b1);border-radius:6px;color:var(--sub);font-size:10px;padding:3px 10px;width:55%;}
.edit-on .b-sub{display:none;}
.edit-on .b-sub-inp{display:block;}
/* moogle */
.mog-wrap{position:absolute;right:12px;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;}
.mog-ball{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(245,165,32,.8);margin-bottom:-2px;z-index:3;position:relative;}
.mog-stem{width:2px;height:18px;background:rgba(245,165,32,.5);margin:0 auto;}
.mog-img{width:96px;object-fit:contain;object-position:bottom;display:block;filter:drop-shadow(0 2px 8px rgba(232,37,58,.15));}

/* ── FF14 ── */
.ff14{padding:10px 12px;}
.job-badge{display:inline-flex;align-items:center;gap:6px;background:var(--p2);border:1.5px solid var(--b1);border-radius:20px;padding:4px 12px;font-size:11px;margin-bottom:8px;}
.jdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.lv-badge{background:var(--red3);color:var(--red);font-size:9.5px;font-weight:700;padding:2px 9px;border-radius:10px;margin-left:6px;border:1px solid var(--b1);}
.job-sel{display:none;background:var(--p2);border:1px solid var(--b1);border-radius:20px;color:var(--txt);padding:3px 10px;font-size:11px;margin-bottom:8px;}
.lv-inp{display:none;width:64px;color:var(--red);padding:2px 8px;font-size:9.5px;font-weight:700;text-align:center;margin-left:6px;}
.edit-on .job-badge{display:none;}
.edit-on .job-sel{display:inline-block;}
.edit-on .lv-badge{display:none;}
.edit-on .lv-inp{display:inline-block;}
.ffr{display:flex;gap:8px;margin-bottom:6px;align-items:center;}
.ffl{color:var(--muted);font-size:10px;min-width:52px;flex-shrink:0;}
.ffv{color:var(--txt);font-size:11px;}
.ffv.empty{color:var(--muted);font-style:italic;}
.ffv-inp{display:none;flex:1;}
.edit-on .ffv{display:none;}
.edit-on .ffv-inp{display:flex;}

/* ── SECTIONS ── */
.sc{padding:10px 12px;font-size:11px;line-height:1.75;}

/* ── HOURS ── */
.hgrid{display:flex;gap:2px;margin-bottom:2px;}
.hb{flex:1;height:14px;background:var(--p2);border:1px solid var(--b1);border-radius:2px;transition:background .1s;}
.hb.on{background:var(--red2);border-color:var(--red);}
.edit-on .hb{cursor:pointer;}
.edit-on .hb:hover:not(.on){background:var(--red3);}
.hscale{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-bottom:10px;}
.hour-hint{display:none;color:var(--red2);font-size:9px;margin-top:4px;margin-bottom:8px;}
.edit-on .hour-hint{display:block;}
.hlabel{color:var(--muted);font-size:10px;margin-bottom:4px;}

/* ── CLOCK / CAL ── */
.clock-d{text-align:center;font-size:22px;font-family:'Courier New',monospace;color:var(--red);letter-spacing:2px;padding:12px 8px 4px;text-shadow:0 1px 8px rgba(232,37,58,.2);font-variant-numeric:tabular-nums;}
.date-d{text-align:center;color:var(--muted);font-size:10px;padding-bottom:10px;}
.cal{padding:8px;}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.cal-mon{color:var(--red);font-size:11px;font-weight:700;}
.cal-btn{background:var(--red3);color:var(--red);width:18px;height:18px;font-size:9px;border:1px solid var(--b1);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cal-btn:hover{background:var(--red);color:#fff;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.cal-dh{text-align:center;font-size:9px;color:var(--muted);padding:2px 0;}
.cal-d{text-align:center;font-size:10px;padding:3px 1px;color:var(--txt);}
.cal-d.other{color:#ddc0c4;}
.cal-d.today{background:var(--red);color:#fff;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;margin:0 auto;}
.cal-d.sun{color:var(--red);}
.cal-d.sat{color:#7788cc;}
.url-box{padding:8px;}
.url-inp{width:100%;margin-bottom:5px;font-size:10px;}
.url-btn{width:100%;background:var(--red);color:#fff;font-size:11px;padding:5px;border-radius:6px;font-weight:700;}
.url-btn:hover{background:#c01828;}

/* ── LISTING ── */
#listing-pg{max-width:970px;margin:0 auto;}
.list-hdr{border-bottom:2px solid var(--b1);padding:10px 0;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.list-title{color:var(--red);font-size:17px;font-weight:700;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;}
.card-item{background:var(--panel);border:1.5px solid var(--b1);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.card-item:hover{border-color:var(--red2);box-shadow:0 3px 14px rgba(232,37,58,.12);}
.ci-av{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--red);background:var(--red3);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ci-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.ci-name{color:var(--red);font-size:12px;font-weight:700;}
.ci-id{color:var(--muted);font-size:10px;margin-top:2px;}
.ci-bio{color:var(--sub);font-size:10px;margin-top:5px;line-height:1.5;}
.ci-job{display:inline-flex;align-items:center;gap:4px;background:var(--p2);border:1px solid var(--b1);border-radius:20px;font-size:10px;padding:2px 8px;margin-top:5px;}
.card-new{background:var(--panel);border:1.5px dashed var(--b2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;min-height:140px;transition:border-color .15s;}
.card-new:hover{border-color:var(--red);}

/* ── AUTH ── */
.auth-pg{max-width:360px;margin:36px auto;background:var(--panel);border:1px solid var(--b1);border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(232,37,58,.08);}
.auth-ph{background:linear-gradient(90deg,var(--red),#c01828);color:#fff;padding:10px 14px;font-size:13px;font-weight:700;letter-spacing:.5px;}
.auth-body{padding:20px;}
.fg{margin-bottom:12px;}
.fg label{display:block;color:var(--sub);font-size:11px;margin-bottom:4px;}
.fg input{width:100%;padding:6px 10px;}
.btn-main{width:100%;background:var(--red);color:#fff;font-size:12px;padding:8px;border-radius:8px;letter-spacing:.5px;font-weight:700;}
.btn-main:hover{background:#c01828;}
.auth-lnk{margin-top:10px;color:var(--muted);font-size:11px;text-align:center;}
.err{color:var(--red2);font-size:11px;margin-top:8px;text-align:center;}
.notice-box{background:var(--red3);border:1px solid var(--b2);border-left:3px solid var(--red);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--sub);margin-bottom:10px;}

/* 태블릿: 왼쪽 축소 + 오른쪽 아래로 */
@media(max-width:900px){
  #naru{grid-template-columns:130px 1fr;}
  #naru>div:last-child{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  #naru>div:last-child .panel{margin-bottom:0;}
}
/* 모바일: 중앙 먼저, 단일 컬럼 */
@media(max-width:620px){
  #app{padding:6px 8px;}
  #naru{grid-template-columns:1fr;gap:0;}
  #naru>div:nth-child(1){order:2;}
  #naru>div:nth-child(2){order:1;}
  #naru>div:nth-child(3){order:3;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  #naru>div:nth-child(3) .panel{margin-bottom:0;}
  /* 왼쪽 사이드바 가로형으로 */
  .l-wrap{display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;}
  .l-av{width:58px;height:58px;margin:0;flex-shrink:0;}
  .l-name{font-size:12px;}
  .l-socials{justify-content:flex-start;}
  .x-url-inp{margin-top:2px;}
  /* 배너 */
  .banner{min-height:80px;padding:12px 12px;}
  .b-title{font-size:17px;letter-spacing:1px;}
  .mog-wrap{right:8px;}
  .mog-img{width:70px;}
  /* 폼 */
  .b-title-inp{width:70%;font-size:15px;}
  .b-sub-inp{width:70%;}
}
</style>
</head>
<body>

<!-- ── Rabbit SVG symbol (no body, chubby) ── -->
<svg style="display:none">
  <symbol id="rab-s" viewBox="0 0 24 24">
    <ellipse cx="7" cy="5" rx="3.2" ry="4.8"/>
    <ellipse cx="17" cy="5" rx="3.2" ry="4.8"/>
    <circle cx="12" cy="16" r="8.5"/>
  </symbol>
</svg>

<!-- ── LOGIN MODAL ── -->
<div id="login-modal" style="display:none">
  <div class="modal-bg" onclick="closeModal()"></div>
  <div class="modal-box">
    <div class="modal-ph">
      <span id="modal-title">
        <svg class="rab" width="13" height="16" viewBox="0 0 24 24" fill="#fff"><use href="#rab-s"/></svg>
        로그인
      </span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="m-notice" class="m-notice" style="display:none">Supabase 연결 후 사용 가능합니다.</div>

      <!-- 로그인 폼 -->
      <div id="form-login">
        <div class="m-fg"><label>아이디</label><input id="m-em" type="text" placeholder="아이디"></div>
        <div class="m-fg"><label>비밀번호</label><input id="m-pw" type="password" placeholder="비밀번호"></div>
        <button class="m-btn" onclick="doModalLogin()">로그인</button>
        <div class="m-err" id="m-err"></div>
      </div>

      <!-- 프로필 생성 폼 (첫 로그인 후) -->
      <div id="form-setup" style="display:none">
        <div class="m-fg"><label>아이디 (영문/숫자/_)</label><input id="s-un" type="text" placeholder="my_id"></div>
        <div class="m-fg"><label>표시 이름</label><input id="s-nm" type="text" placeholder="닉네임"></div>
        <button class="m-btn" onclick="doProfileSetup()">프로필 만들기</button>
        <div class="m-err" id="s-err"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── NAV ── -->
<nav id="topnav">
  <div class="logo">
    <svg class="rab" width="16" height="20" viewBox="0 0 24 24" fill="var(--red)"><use href="#rab-s"/></svg>
    단지
  </div>
  <span class="sp"></span>
  <span class="nav-cur" id="nav-user"></span>
  <button class="nav-edit-btn" id="nav-edit-btn" style="display:none" onclick="toggleEditMode()">✏ 수정 모드</button>
  <a id="nav-login" href="#" onclick="openModal();return false">로그인</a>
  <a id="nav-logout" href="#" style="display:none" onclick="doLogout();return false">로그아웃</a>
</nav>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script>
/* ── CONFIG ── */
const SUPABASE_URL = 'https://juewbxriakymsyoamizl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-QgYgJU1nV3sxTpttCno_w_OnH93G9C';

/* ── FF14 DATA ── */
const ROLES = {
  tank:   { label:'탱커',  color:'#4488cc', jobs:['나이트','전사','암흑기사','건브레이커'] },
  healer: { label:'힐러',  color:'#44cc88', jobs:['백마도사','학자','점성술사','현자'] },
  melee:  { label:'근딜',  color:'#cc4444', jobs:['용기사','닌자','몽크','사무라이','리퍼','바이퍼'] },
  ranged: { label:'원딜',  color:'#cc8844', jobs:['음유시인','기공사','무도가'] },
  magic:  { label:'마딜',  color:'#9944cc', jobs:['흑마도사','소환사','적마도사','픽토맨서'] }
};
const JOB_ROLE = {};
Object.entries(ROLES).forEach(([role, { jobs }]) => jobs.forEach(j => JOB_ROLE[j] = role));

/* ── STATE ── */
const DEMO = typeof supabase === 'undefined' || !SUPABASE_URL.includes('supabase');
let db = null, me = null, myProfile = null;
let editMode = false, pendingAvatarFile = null, autoEditOnLoad = false, isSaving = false;
let wdSet = new Set(), hoSet = new Set();
let clockTmr = null, calY, calM;
let currentUsername = null;

/* ── INIT ── */
async function init() {
  if (!DEMO) {
    try {
      db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(e) {
      document.getElementById('app').innerHTML =
        `<div style="text-align:center;padding:40px;color:var(--muted)">Supabase 초기화 오류: ${e.message}</div>`;
      updateNav(); return;
    }
    try {
      const { data: { session } } = await db.auth.getSession();
      if (session) { me = session.user; await loadMyProfile(); }
    } catch(e) { console.warn('getSession 오류:', e); }
    db.auth.onAuthStateChange(async (event, sess) => {
      me = sess?.user || null;
      if (me) {
        await loadMyProfile();
        if (!myProfile) {
          const un = (me.email || '').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'_').slice(0,20) || 'user';
          await db.from('profiles').insert({ id: me.id, username: un, display_name: '' });
          await loadMyProfile();
          autoEditOnLoad = true;
        }
        updateNav();
        if (myProfile) {
          localStorage.setItem('lastProfile', myProfile.username);
          const h = location.hash || '#/';
          if (h === '#/' || h === '#/login') { go('#/u/' + myProfile.username); return; }
        }
        if (event === 'SIGNED_IN' && myProfile) { go('#/u/' + myProfile.username); return; }
      } else { myProfile = null; }
      updateNav();
    });
  }
  updateNav(); route();
}

async function loadMyProfile() {
  if (!db || !me) return;
  let { data } = await db.from('profiles').select('*').eq('id', me.id).single();
  if (!data && me.email) {
    // id 기반 조회 실패 시 username으로 재시도
    const un = me.email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'_').slice(0,20);
    const res = await db.from('profiles').select('*').eq('username', un).maybeSingle();
    if (res.data) data = res.data;
  }
  if (data) {
    myProfile = data;
    localStorage.setItem('lastProfile', data.username);
  }
}
async function tryCreatePendingProfile() {
  const raw = localStorage.getItem('pendingProfile');
  if (!raw || !me) return;
  const { username, display_name } = JSON.parse(raw);
  const { error } = await db.from('profiles').insert({ id: me.id, username, display_name });
  if (!error) { localStorage.removeItem('pendingProfile'); await loadMyProfile(); }
}

function updateNav() {
  const nu = document.getElementById('nav-user');
  const nl = document.getElementById('nav-login');
  const nb = document.getElementById('nav-edit-btn');
  const nlo = document.getElementById('nav-logout');
  if (me) {
    nu.textContent = myProfile?.display_name || me.email || '';
    nl.style.display = 'none';
    nlo.style.display = '';
  } else {
    nu.textContent = DEMO ? '[ 데모 ]' : '';
    nl.style.display = '';
    nlo.style.display = 'none';
  }
  const isOwn = !!(me && myProfile && myProfile.username === currentUsername);
  nb.style.display = isOwn ? '' : 'none';
  if (!isSaving) {
    nb.textContent = editMode ? '✓ 저장하기' : '✏ 수정 모드';
  }
  nb.classList.toggle('on', editMode);
}

async function doLogout() {
  if (!DEMO) {
    try {
      await Promise.race([
        db.auth.signOut(),
        new Promise(r => setTimeout(r, 5000))
      ]);
    } catch(e) { console.warn('signOut:', e); }
  }
  const lastUn = localStorage.getItem('lastProfile') || 'danji';
  me = null; myProfile = null; editMode = false; isSaving = false;
  updateNav(); go('#/u/' + lastUn);
}

/* ── ROUTER ── */
function route() {
  stopClock();
  editMode = false; pendingAvatarFile = null;
  const h = location.hash || '#/';
  const app = document.getElementById('app');
  if (h === '#/' || h === '') {
    // 루트: 프로필 페이지로 바로 리다이렉트
    if (me && myProfile) { go('#/u/' + myProfile.username); return; }
    const lastUn = localStorage.getItem('lastProfile') || 'danji';
    go('#/u/' + lastUn); return;
  }
  else if (h === '#/login')          renderLogin(app);
  else if (h === '#/register')       { route(); openProfileSetup(); }
  else if (h === '#/edit') {
    if (myProfile) { go('#/u/' + myProfile.username); return; }
    go('#/login');
  }
  else if (h.startsWith('#/u/'))     renderProfile(app, h.slice(4));
  else app.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">페이지를 찾을 수 없습니다. <a href="#/">← 목록으로</a></div>';
}
window.addEventListener('hashchange', route);
function go(h) { location.hash = h; }

/* ── LISTING ── */
async function renderListing(app) {
  currentUsername = null; updateNav();
  if (DEMO) {
    const demoDbg = `DEMO=true | supabase=${typeof supabase} | url="${SUPABASE_URL}"`;
    app.innerHTML = `<div id="listing-pg">
      <div class="list-hdr">
        <svg class="rab" width="22" height="28" viewBox="0 0 24 24" fill="var(--red)"><use href="#rab-s"/></svg>
        <span class="list-title">단지</span>
        <span style="color:var(--muted);font-size:10px">[ DEMO 모드 ]</span>
      </div>
      <div style="font-size:12px;color:var(--txt);padding:4px 0 6px;word-break:break-all">${demoDbg}</div>
      <div class="notice-box">Supabase URL과 KEY를 설정하면 프로필이 표시됩니다.</div>
    </div>`;
    return;
  }
  try {
    let list = null;
    let diag = '';

    // Step 0: SECURITY DEFINER function (bypasses RLS/anon-key issues entirely)
    try {
      const { data: rpcData, error: rpcErr } = await db.rpc('get_all_profiles');
      console.log('[list] rpc:', rpcData?.length, rpcErr?.message);
      diag = `rpc:${rpcErr ? rpcErr.code||'err' : rpcData?.length}`;
      if (!rpcErr && rpcData && rpcData.length > 0) list = rpcData;
    } catch(re) { diag = 'rpc:ex'; }

    // Step 1: supabase-js direct query
    if (!list) {
      const { data: qdata, error: qerr } = await db.from('profiles').select('*');
      console.log('[list] sb:', qdata?.length, qerr?.message);
      diag += ` sb:${qerr ? qerr.code||'err' : qdata?.length??'null'}`;
      if (!qerr && qdata && qdata.length > 0) list = qdata;
    }

    // Step 2: raw fetch with apikey header only
    if (!list) {
      const hdrs = { 'apikey': SUPABASE_KEY };
      if (me) {
        const { data: sd } = await db.auth.getSession();
        if (sd?.session?.access_token) hdrs['Authorization'] = `Bearer ${sd.session.access_token}`;
      }
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?select=*`, { headers: hdrs });
        if (res.ok) {
          const fetched = await res.json();
          console.log('[list] fetch:', res.status, fetched?.length);
          diag += ` fetch:${res.status}/${fetched?.length}`;
          if (fetched.length > 0) list = fetched;
        } else {
          const txt = await res.text();
          console.warn('[list] fetch err:', res.status, txt);
          diag += ` fetch:${res.status}`;
        }
      } catch(fe) { diag += ' fetch:ex'; }
    }

    // Step 3: own profile fallback (logged-in only)
    if (!list && myProfile) list = [myProfile];

    // Step 4: username 개별조회 - localStorage 또는 'danji' (anon fallback)
    if (!list) {
      const tryUn = localStorage.getItem('lastProfile') || 'danji';
      const { data: p4 } = await db.from('profiles').select('*').eq('username', tryUn).maybeSingle();
      if (p4) { list = [p4]; diag += ` un:${tryUn}`; }
    }

    const items = (list || []).map(p => cardItem(p)).join('');
    app.innerHTML = `<div id="listing-pg">
      <div class="list-hdr">
        <svg class="rab" width="22" height="28" viewBox="0 0 24 24" fill="var(--red)"><use href="#rab-s"/></svg>
        <span class="list-title">단지</span>
        <span style="color:var(--sub);font-size:10px">(${(list||[]).length}명)</span>
      </div>
      <div id="list-diag" style="font-size:12px;color:var(--txt);padding:4px 0 6px;word-break:break-all">${diag}</div>
      <div class="card-grid">
        ${items || '<div style="color:var(--txt);font-size:12px;padding:20px;opacity:.5">프로필 없음</div>'}
        ${me && !myProfile ? `<div class="card-new" onclick="autoEditOnLoad=true;go('#/u/'+me.email.split('@')[0])">
          <svg class="rab" width="28" height="35" viewBox="0 0 24 24" fill="var(--red2)"><use href="#rab-s"/></svg>
          <div style="color:var(--sub);font-size:11px">내 프로필 만들기</div>
        </div>` : ''}
      </div>
    </div>`;
  } catch(e) {
    console.error('[list] ex:', e);
    app.innerHTML = `<div style="text-align:center;padding:40px;color:var(--txt)">오류: ${e.message}</div>`;
  }
}

function cardItem(p) {
  const role = ROLES[p.ff14_role] || ROLES.magic;
  const av = p.avatar_url
    ? `<img src="${esc(p.avatar_url)}" alt="" onerror="this.parentElement.innerHTML='<svg class=\\'rab\\' width=\\'32\\' height=\\'40\\' viewBox=\\'0 0 24 24\\' fill=\\'var(--red2)\\'><use href=\\'#rab-s\\'/></svg>'">`
    : `<svg class="rab" width="32" height="40" viewBox="0 0 24 24" fill="var(--red2)"><use href="#rab-s"/></svg>`;
  return `<div class="card-item" onclick="go('#/u/${esc(p.username)}')">
    <div class="ci-av">${av}</div>
    <div class="ci-name">${esc(p.display_name || p.username)}</div>
    <div class="ci-id">@${esc(p.username)}</div>
    ${(p.links?.bio) ? `<div class="ci-bio">${esc(p.links.bio)}</div>` : ''}
    ${p.ff14_job ? `<div class="ci-job"><span style="width:7px;height:7px;border-radius:50%;background:${role.color};display:inline-block"></span>${esc(p.ff14_job)}</div>` : ''}
  </div>`;
}

        <div class="url-box">
          <input class="url-inp" id="purl" value="${esc(purl)}" readonly>
          <button class="url-btn" onclick="copyUrl()">링크 복사 📋</button>
        </div>
      </div>
      <div style="border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(232,37,58,.08);margin-bottom:8px;">
        <img src="moogle2.jpg" alt="" style="width:100%;display:block;">
      </div>
    </div>

  </div><!-- /#naru -->
  </div><!-- /#pw -->`;

  updateNav();
  initHourBars();
  startClock();
  calY = undefined; calM = undefined; renderCal();
  if (autoEditOnLoad) { autoEditOnLoad = false; toggleEditMode(); }
}

/* ── EDIT MODE TOGGLE ── */
async function toggleEditMode() {
  if (editMode) {
    await saveProfile();
  } else {
    editMode = true;
    const pw = document.getElementById('pw');
    if (pw) pw.classList.add('edit-on');
    updateNavBtn();
  }
}

function updateNavBtn() {
  const nb = document.getElementById('nav-edit-btn');
  if (!nb) return;
  nb.textContent = editMode ? '✓ 저장하기' : '✏ 수정 모드';
  nb.classList.toggle('on', editMode);
}

function showToast(msg) {
  let t = document.getElementById('save-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'save-toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.style.opacity = '0'; }, 2000);
}

/* ── SAVE ── */
async function saveProfile() {
  if (DEMO) { alert('Supabase 연결 후 저장 가능합니다.'); return; }
  if (!me) { alert('로그인 후 저장 가능합니다.'); return; }
  if (!myProfile) {
    alert('프로필 정보를 불러올 수 없습니다.\n새로고침 후 다시 로그인해주세요.');
    return;
  }

  isSaving = true;
  const nb = document.getElementById('nav-edit-btn');
  if (nb) { nb.disabled = true; nb.textContent = '저장 중...'; }

  const dbTimeout = (promise) => Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error('요청 시간 초과 (15초)')), 15000))
  ]);

  try {
    // 파일 업로드 vs URL 입력 vs 삭제 처리
    let avatarUrl;
    if (pendingAvatarFile && db) {
      const up = await uploadAvatar(pendingAvatarFile);
      avatarUrl = up || myProfile.avatar_url || ''; // 업로드 실패 시 기존 유지
    } else {
      // URL 입력값을 그대로 사용 (빈 문자열 = 사진 삭제)
      avatarUrl = (document.getElementById('e-av')?.value ?? '').trim();
    }

    const job = document.getElementById('e-job')?.value || myProfile.ff14_job || '';
    const oldLnk = myProfile.links || {};
    const v = id => document.getElementById(id)?.value ?? '';
    const payload = {
      display_name: v('e-btitle') || v('e-dname'),
      intro:        v('e-intro'),
      avatar_url:   avatarUrl,
      ff14_name:    v('e-char'),
      ff14_server:  v('e-srv'),
      ff14_job:     job,
      ff14_level:   parseInt(v('e-lv')) || null,
      ff14_fc:      v('e-fc'),
      links:        { ...oldLnk, bio: v('e-bsub') || v('e-bio'), twitter: v('e-tw') },
      ff14_hours:   { wd: [...(wdSet || [])], ho: [...(hoSet || [])] },
      updated_at:   new Date().toISOString()
    };

    // id 기반 UPDATE → 0행이면 username 기반으로 재시도
    let { data: updRows, error } = await dbTimeout(
      db.from('profiles').update(payload).eq('id', me.id).select()
    );
    if (!error && (!updRows || updRows.length === 0) && myProfile.username) {
      const res = await dbTimeout(
        db.from('profiles').update(payload).eq('username', myProfile.username).select()
      );
      updRows = res.data; error = res.error;
    }
    if (error) { alert('저장 실패: ' + error.message); return; }
    if (!updRows || updRows.length === 0) { alert('저장 실패: 프로필 행을 찾을 수 없습니다.'); return; }

    myProfile = { ...myProfile, ...payload };
    editMode = false;
    pendingAvatarFile = null;
    showToast('저장됐어요!');
    renderProfile(document.getElementById('app'), myProfile.username);
  } catch (e) {
    alert('저장 중 오류: ' + (e?.message || e));
  } finally {
    isSaving = false;
    if (nb) { nb.disabled = false; }
    updateNav();
  }
}

function saveSection() { saveProfile(); }

async function uploadAvatar(file) {
  if (!db || !me) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${me.id}.${ext}`;
  const { error } = await db.storage.from('avatars').upload(path, file, { upsert: true, contentType: file.type });
  if (error) {
    showToast('사진 업로드 실패 — Supabase Storage 권한을 확인하세요');
    console.error('[upload]', error.message);
    return null;
  }
  return db.storage.from('avatars').getPublicUrl(path).data.publicUrl;
}

/* ── AVATAR DELETE ── */
function deleteAvatar() {
  const inp = document.getElementById('e-av');
  if (inp) inp.value = '';
  pendingAvatarFile = null;
  const wrap = document.getElementById('avWrap');
  if (wrap) {
    const img = wrap.querySelector('img');
    if (img) img.replaceWith(mkRabSvg(48, 60));
  }
  const delBtn = document.getElementById('av-del-btn');
  if (delBtn) delBtn.style.display = 'none';
}

/* ── AVATAR UPLOAD ── */
function onAvClick() {
  const pw = document.getElementById('pw');
  if (!pw?.classList.contains('edit-on')) return;
  document.getElementById('av-file')?.click();
}

function onFileChange(e) {
  const file = e.target.files[0]; if (!file) return;
  pendingAvatarFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const wrap = document.getElementById('avWrap');
    if (!wrap) return;
    let img = document.getElementById('av-img');
    if (!img) {
      wrap.querySelector('svg')?.remove();
      img = document.createElement('img');
      img.id = 'av-img'; img.alt = '';
      wrap.insertBefore(img, wrap.firstChild);
    }
    img.src = ev.target.result;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
    const urlInp = document.getElementById('e-av');
    if (urlInp) urlInp.placeholder = '파일 선택됨 (저장 시 업로드)';
    const delBtn = document.getElementById('av-del-btn');
    if (delBtn) delBtn.style.display = '';
  };
  reader.readAsDataURL(file);
}

/* ── JOB CHANGE ── */
function onJobChange() {
  const job = document.getElementById('e-job')?.value;
  const role = ROLES[JOB_ROLE[job]] || ROLES.magic;
  const vJob = document.getElementById('v-job');
  const vRole = document.getElementById('v-role');
  if (vJob) vJob.textContent = job || '직업 미설정';
  if (vRole) vRole.textContent = job ? role.label : '';
  const dot = document.querySelector('.job-badge .jdot');
  if (dot) dot.style.background = role.color;
}

/* ── HOUR BARS ── */
function initHourBars() {
  ['hwd','hho'].forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    const set = id === 'hwd' ? wdSet : hoSet;
    el.innerHTML = Array.from({length:24},(_,i) =>
      `<div class="hb${set.has(i)?' on':''}" data-h="${i}"></div>`).join('');
    el.addEventListener('click', ev => {
      const pw = document.getElementById('pw');
      if (!pw?.classList.contains('edit-on')) return;
      const b = ev.target.closest('.hb'); if (!b) return;
      const h = +b.dataset.h;
      if (set.has(h)) { set.delete(h); b.classList.remove('on'); }
      else { set.add(h); b.classList.add('on'); }
    });
  });
}

/* ── HELPERS ── */
function ss(id) { document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}); }
function copyUrl() {
  const inp = document.getElementById('purl'); if (!inp) return;
  navigator.clipboard.writeText(inp.value).then(() => {
    const btn = inp.nextElementSibling; if (!btn) return;
    btn.textContent = '복사됨 ✓';
    setTimeout(() => btn.textContent = '링크 복사 📋', 1600);
  });
}
function pad(n) { return String(n).padStart(2,'0'); }
function esc(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── CLOCK ── */
function stopClock() { if (clockTmr) { clearInterval(clockTmr); clockTmr = null; } }
function startClock() {
  const days = '일월화수목금토';
  function tick() {
    const n = new Date();
    const el = document.getElementById('clock');
    if (!el) { stopClock(); return; }
    el.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    const de = document.getElementById('clock-date');
    if (de) de.textContent = `${n.getFullYear()}.${pad(n.getMonth()+1)}.${pad(n.getDate())} (${days[n.getDay()]})`;
  }
  tick(); clockTmr = setInterval(tick, 1000);
}

/* ── CALENDAR ── */
function renderCal() {
  const now = new Date();
  if (calY === undefined) calY = now.getFullYear();
  if (calM === undefined) calM = now.getMonth();
  const ty = now.getFullYear(), tm = now.getMonth(), td = now.getDate();
  const cal = document.getElementById('cal'); if (!cal) return;
  const fd = new Date(calY,calM,1).getDay(), ld = new Date(calY,calM+1,0).getDate(), pld = new Date(calY,calM,0).getDate();
  const MN = '1월,2월,3월,4월,5월,6월,7월,8월,9월,10월,11월,12월'.split(',');
  let c = '일월화수목금토'.split('').map((d,i) =>
    `<div class="cal-dh" style="${i===0?'color:var(--red)':i===6?'color:#7788cc':''}">${d}</div>`).join('');
  for (let i=fd-1;i>=0;i--) c += `<div class="cal-d other">${pld-i}</div>`;
  for (let d=1;d<=ld;d++) {
    const isT = calY===ty&&calM===tm&&d===td;
    const dw = new Date(calY,calM,d).getDay();
    const cl = isT?'today':dw===0?'sun':dw===6?'sat':'';
    c += `<div class="cal-d${cl?' '+cl:''}">${d}</div>`;
  }
  const rem = (fd+ld)%7===0?0:7-((fd+ld)%7);
  for (let d=1;d<=rem;d++) c += `<div class="cal-d other">${d}</div>`;
  cal.innerHTML = `<div class="cal-hdr"><button class="cal-btn" onclick="calNav(-1)">◀</button><span class="cal-mon">${calY}년 ${MN[calM]}</span><button class="cal-btn" onclick="calNav(1)">▶</button></div><div class="cal-grid">${c}</div>`;
}
function calNav(d) { calM+=d; if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCal(); }

/* ── MODAL ── */
function openModal() {
  const m = document.getElementById('login-modal');
  const notice = document.getElementById('m-notice');
  if (notice) notice.style.display = DEMO ? '' : 'none';
  document.getElementById('form-login').style.display = '';
  document.getElementById('form-setup').style.display = 'none';
  document.getElementById('modal-title').textContent = '로그인';
  m.style.display = '';
  document.getElementById('m-em').focus();
}
function openProfileSetup() {
  const m = document.getElementById('login-modal');
  document.getElementById('form-login').style.display = 'none';
  document.getElementById('form-setup').style.display = '';
  document.getElementById('modal-title').textContent = '프로필 설정';
  m.style.display = '';
  document.getElementById('s-un').focus();
}
function closeModal() {
  document.getElementById('login-modal').style.display = 'none';
  document.getElementById('m-err').textContent = '';
}
async function doProfileSetup() {
  if (!me) return;
  const un  = document.getElementById('s-un').value.trim().toLowerCase();
  const nm  = document.getElementById('s-nm').value.trim();
  const err = document.getElementById('s-err');
  if (!/^[a-z0-9_]{3,20}$/.test(un)) { err.textContent = '아이디는 영소문자/숫자/_로 3~20자'; return; }
  err.textContent = '처리 중...';
  const { error } = await db.from('profiles').insert({ id: me.id, username: un, display_name: nm });
  if (error) { err.textContent = '생성 실패: ' + error.message; return; }
  await loadMyProfile();
  closeModal();
  go('#/u/' + un);
}
function toEmail(id) { return id.trim().toLowerCase() + '@danji.local'; }
async function doModalLogin() {
  if (DEMO || !db) { document.getElementById('m-err').textContent = 'DB 연결 안 됨'; return; }
  const err = document.getElementById('m-err');
  err.textContent = '로그인 중...';
  const idVal = document.getElementById('m-em').value.trim();
  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: toEmail(idVal),
      password: document.getElementById('m-pw').value
    });
    if (error) { err.textContent = '로그인 실패: ' + error.message; return; }
    me = data.user;
    closeModal();
    await loadMyProfile();
    updateNav();
    go(myProfile ? '#/u/' + myProfile.username : '#/u/' + idVal.toLowerCase());
  } catch(e) { err.textContent = '오류: ' + e.message; }
}
async function doModalRegister() {
  if (DEMO) return;
  const pw    = document.getElementById('r-pw').value;
  const un    = document.getElementById('r-un').value.trim().toLowerCase();
  const nm    = document.getElementById('r-nm').value.trim();
  const email = toEmail(un);
  const err   = document.getElementById('r-err');
  if (!/^[a-z0-9_]{3,20}$/.test(un)) { err.textContent = '아이디는 영소문자/숫자/_로 3~20자'; return; }
  err.textContent = '확인 중...';
  const { count } = await db.from('profiles').select('*', { count: 'exact', head: true });
  if (count > 0) { err.textContent = '이미 등록된 계정이 있습니다.'; return; }
  err.textContent = '처리 중...';
  const { data, error } = await db.auth.signUp({ email, password: pw });
  if (error) { err.textContent = error.message; return; }
  if (!data.session) {
    localStorage.setItem('pendingProfile', JSON.stringify({ username: un, display_name: nm }));
    err.style.color = 'var(--sub)';
    err.textContent = '가입 완료! 이메일 확인 링크를 클릭한 후 이 페이지로 돌아와 로그인해 주세요.';
    return;
  }
  const { error: pe } = await db.from('profiles').insert({ id: data.user.id, username: un, display_name: nm });
  if (pe) { err.textContent = '프로필 생성 실패: ' + pe.message; return; }
  closeModal();
  go('#/u/' + un);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
